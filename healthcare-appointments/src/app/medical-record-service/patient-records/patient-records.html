<p>patient-records works!</p>
<div class="container mt-4">
  <h2>Patient Records</h2>
  <div class="mb-2">
    <label for="pid">Patient ID</label>
    <input id="pid" [(ngModel)]="patientId" name="patientId" class="form-control" type="number">
    <button (click)="loadRecords()" class="btn btn-info mt-2">Load</button>
  </div>

  <table class="table table-bordered mt-3" *ngIf="records.length">
    <thead>
      <tr>
        <th>ID</th>
        <th>Visit Date</th>
        <th>Doctor</th>
        <th>Diagnosis</th>
        <th>Prescription</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of records">
        <td>{{r.id}}</td>
        <td>{{r.visitDate}}</td>
        <td>{{r.doctorName}}</td>
        <td>{{r.diagnosis}}</td>
        <td>{{r.prescription || 'Pending'}}</td>
      </tr>
    </tbody>
  </table>
</div>
